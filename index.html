<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/standards.css" />
    <link
      rel="shortcut icon"
      href="./assets/icons/pokedex_logo.png"
      type="image/x-icon"
    />
    <script src="./templates/templates.js"></script>
  </head>
  <body onload="onLoadFunc()">
    <header class="main-header">
      <div class="header-left">
        <img src="./assets/icons/pokedex_logo.png" alt="Pokédex logo" />
      </div>
      <h1>Pokédex</h1>
      <div class="header-right">
        <input
          type="text"
          placeholder="Search Pokémon..."
          data-id="search-input"
          aria-label="Search Pokémon by name"
        />
        <button data-id="search-button" aria-label="Search Pokémon" disabled>
          Search
        </button>
      </div>
    </header>
    <main data-id="content" class="main-content">
      <ul id="pokemonContainer"></ul>
      <div data-id="loading-screen" class="loading-screen d-none">
        <div class="spinner"></div>
      </div>
      <button
        data-id="load-more-button"
        id="load-more-button"
        aria-label="Load more Pokémon"
      >
        Load More
      </button>
    </main>
    <footer class="main-footer"></footer>
    <dialog
      id="pkmnCardDialog"
      data-id="dialog"
      aria-label="Pokémon details"
    ></dialog>
    <script src="./script.js"></script>
  </body>
</html>
